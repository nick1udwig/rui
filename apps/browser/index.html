<!doctype html>
<html lang="en" data-workspace="browser">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#16352b" />
    <title>RUI Browser</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <div>
        <strong
          ><span class="brand-mark" aria-hidden="true">r</span> RUI
          Browser</strong
        ><span id="connection">Not paired</span>
      </div>
      <nav aria-label="Session">
        <button id="connect">Connect</button
        ><button id="control" disabled>Take control</button
        ><button id="release" disabled>Release</button
        ><button id="retry" hidden>Resolve pending action</button>
      </nav>
    </header>
    <main>
      <section id="pairing" hidden>
        <h1>Pair this device</h1>
        <p id="pair-status"></p>
      </section>
      <div id="view"></div>
      <p id="status" role="status" aria-live="polite">
        Scan the host’s pairing QR code to begin.
      </p>
      <details class="session-details">
        <summary>Session details</summary>
        <p id="coverage"></p>
        <button id="forget">Forget device</button>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
