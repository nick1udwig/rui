[package]
name = "rui-client-desktop"
version.workspace = true
edition.workspace = true

[features]
desktop = ["dep:gtk4", "dep:rui-transport", "dep:tokio", "dep:prost"]
gtk-source-probe = ["desktop", "rui-producer-sdk/transport", "rui-producer-sdk/gtk-fixture-hooks"]
gtk-demo = ["desktop", "dep:rui-producer-sdk", "rui-producer-sdk/transport"]

[[bin]]
name = "rui-mirror"
path = "src/bin/rui-mirror.rs"
required-features = ["desktop"]

[[bin]]
name = "rui-demo"
path = "src/bin/rui-demo.rs"
required-features = ["gtk-demo"]

[[example]]
name = "native_ime_probe"
required-features = ["desktop"]

[[example]]
name = "native_physical_probe"
required-features = ["desktop"]

[[example]]
name = "desktop_smoke"
required-features = ["desktop"]

[[example]]
name = "corpus_smoke"
required-features = ["desktop"]

[[example]]
name = "gtk_source_probe"
required-features = ["gtk-source-probe"]

[dependencies]
rui-client-core = { path = "../client-core" }
rui-protocol-core = { path = "../protocol-core" }
cairo-rs = { version = "=0.20.12", default-features = false }
thiserror = "2"
sha2 = "0.10"
serde_json = "1"
gtk4 = { version = "=0.9.7", optional = true }
rui-transport = { path = "../transport", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
prost = { version = "0.13", optional = true }
rui-producer-sdk = { path = "../adapters/sdk", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
prost = "0.13"
rui-producer-sdk = { path = "../adapters/sdk" }
rui-host-broker = { path = "../host-broker" }
