[package]
name = "rui-transport"
version.workspace = true
edition.workspace = true

[dependencies]
rui-protocol-core = { path = "../protocol-core" }
rui-host-broker = { path = "../host-broker" }
prost = "0.13"
thiserror = "2"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"
httparse = "1"
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
rui-client-desktop = { path = "../client-desktop" }
