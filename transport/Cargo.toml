[package]
name = "rui-transport"
version.workspace = true
edition.workspace = true

[features]
default = ["native"]
native = ["dep:rui-host-broker", "dep:sha2", "dep:getrandom", "dep:httparse", "dep:log", "dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
rui-protocol-core = { path = "../protocol-core" }
rui-wire = { path = "../wire" }
rui-client-core = { path = "../client-core" }
rui-host-broker = { path = "../host-broker", optional = true }
prost = "0.13"
thiserror = "2"
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
zeroize = "1"
httparse = { version = "1", optional = true }
log = { optional = true, version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tokio = { optional = true, version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { optional = true, version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { optional = true, version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { optional = true, version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { optional = true, version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }

[dev-dependencies]
serde_json = "1"
rui-client-desktop = { path = "../client-desktop" }
