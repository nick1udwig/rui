suite: RUI/0.1 initial conformance specification
status: test_specification_only_no_runner_implemented
date: '2026-10-01'
design: RFC.md
profiles:
- content.no-raster.v1
- mirror2d.core.v1
- semantics.core.v1
fixture_contracts:
  empty: Empty session with authentication condition specified by case.
  controls: Stable-ID button/counter, checkbox, text field, focus and corresponding scenes.
  text: Editable Unicode text, scalar ranges, glyphs, exact font fingerprints and IME contexts.
  list: Stable item IDs, reordering, selection, counts and explicit materialization coverage.
  windows: Two toplevels, popup, tooltip, modal, authoritative canvas and input regions.
  canvas: Vector canvas recording every authoritative input event.
  primitives: Every negotiated primitive, transform, clip, gradient and composition operation.
  strict_vector: Supported vector/text corpus with capture/fallback instrumentation.
  raster_source: Original raster image and separate raster-only canvas, forbidden in strict profile.
  secret: Controller-editable field with independently redacted observer projection.
  large: 10000 records by default, parameterized clients, resource churn and queues.
  gtk_fixture: Pinned instrumented GTK build; requires a real producer adapter.
  atspi_fixture: Controlled AT-SPI source with event-gap, crawl-race and restart injection.
  generated: Seeded, shrinkable graph and transcript generator.
required_observability:
- Committed/staged replica state and revisions
- Authoritative application state and input/action trace
- Command admission, dispatch and result ledger
- Resource ownership, cache, allocation and queue counters
- Decoded protocol messages before encryption
- Applied/presented boundaries and local test images
- Source capture provenance and raster fallback instrumentation
global_invariants:
- No committed dangling references or ownership cycles
- No partial snapshot or transaction publication
- No object ID reuse within an epoch
- No unauthorized disclosure, resource retrieval or dispatch
- At most one dispatch per command key within an epoch
- No raster payload or hidden raster fallback under the strict profile
- Client-only presentation changes do not implicitly alter host layout
- Referenced resources remain available or publication remains staged
- Live, staged and queued data remain within negotiated ceilings
