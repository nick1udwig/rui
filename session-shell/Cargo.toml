[package]
name = "rui-session-shell"
version.workspace = true
edition.workspace = true

[features]
native-eis = ["dep:sha2"]

[dependencies]
rui-protocol-core = { path = "../protocol-core" }
thiserror = "2"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
prost = "0.13"
rui-client-desktop = { path = "../client-desktop" }

[[example]]
name = "native_probe"
required-features = ["native-eis"]
