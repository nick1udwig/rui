[package]
name = "rui-browser-host"
version.workspace = true
edition.workspace = true

[dependencies]
rui-protocol-core = { path = "../protocol-core" }
rui-producer-sdk = { path = "../adapters/sdk" }
rui-host-broker = { path = "../host-broker" }
rui-transport = { path = "../transport" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
getrandom = "0.2"
zeroize = "1"
