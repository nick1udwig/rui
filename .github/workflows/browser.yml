name: WASM and browser clients

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RUI_TEST_BROWSERS: chromium,firefox,webkit

jobs:
  portable:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential protobuf-compiler python3 ca-certificates curl git
      - name: Match browser home ownership to the container user
        run: chown "$(id -u):$(id -g)" "$HOME"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Install the exact binding generator
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("client-wasm/Cargo.toml", "rb"))["dependencies"]["wasm-bindgen"].removeprefix("="))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: python3 client-wasm/build.py
      - run: npm --prefix client-wasm ci && npm --prefix client-browser ci && npm --prefix demos/web ci && npm --prefix demos/semantic ci
      - name: Verify the preinstalled browser version
        run: test "$(node -p 'require("./client-wasm/node_modules/playwright/package.json").version')" = 1.63.0
      - run: npm --prefix client-wasm test
      - run: npm --prefix client-browser test
      - name: Build a reviewable runtime artifact
        working-directory: client-browser
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: rui-client-browser-runtime
          path: ${{ runner.temp }}/rui-client-browser-*.tgz
          retention-days: 7
      - name: Install and serve the runtime tarball outside the checkout
        run: npm --prefix client-browser run test:package
      - run: npm --prefix demos/web run build && npm --prefix demos/semantic run build
      - name: Check served production assets
        run: node demos/web/tests/production.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portable-browser-diagnostics
          path: client-browser/test-output/*.json
          retention-days: 7

  gtk-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned native environment
        run: docker build -f ci/gtk.Dockerfile -t rui-gtk-ci ci
      - name: Run all native and browser integration checks
        run: docker run --rm --init --ipc=host -v "$PWD:/workspace" -v "$RUNNER_TEMP:/ci-output" -e RUI_CI_OUTPUT=/ci-output/rui-gtk-ci rui-gtk-ci bash ci/gtk-check.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gtk-browser-diagnostics
          path: client-browser/test-output/*.json
          retention-days: 7
