name: Protocol and reference renderer

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler meson ninja-build libpixman-1-dev
      - name: Build pinned Cairo geometry backend
        run: |
          ci/build-cairo.sh "$RUNNER_TEMP/rui-cairo" "$RUNNER_TEMP/rui-cairo-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/rui-cairo/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/rui-cairo/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p rui-producer-sdk --features transport,gtk-fixture-hooks --all-targets --locked -- -D warnings
      - run: cargo test -p rui-producer-sdk --features transport,gtk-fixture-hooks --all-targets --locked
      - run: python3 conformance/check.py
      - run: python3 -m unittest adapters.sdk.test_producer adapters.sdk.test_timing adapters.sdk.test_invalidation
      - run: python3 -m unittest adapters.atspi.test_observer adapters.atspi.test_trace
      - run: python3 -m unittest conformance.test_shrink
      - run: python3 -m unittest conformance.test_semantic_client
      - run: python3 -m conformance.typed_interop
      - run: python3 -m unittest conformance.test_full_reference
      - run: python3 -m unittest conformance.test_network_audit conformance.test_indexed_network_audit
      - run: python3 -m conformance.full_interop
      - run: python3 -m conformance.network_audit fixtures/render/native-broad.json.controller.trace.jsonl --replay target/debug/examples/replay --expected fixtures/render/native-broad.controller.audit.json
      - run: python3 -m conformance.network_audit fixtures/render/native-broad.json.observer.trace.jsonl --replay target/debug/examples/replay --expected fixtures/render/native-broad.observer.audit.json
      - run: python3 -m conformance.indexed_network_audit fixtures/gtk/transport-golden/full-visual/protocol/full/index.json --replay target/debug/examples/replay --expected fixtures/gtk/transport-full.audit.json
      - run: python3 -m conformance.network_audit fixtures/gtk/mirror-golden/controller.trace.jsonl --replay target/debug/examples/replay --expected fixtures/gtk/mirror-controller.audit.json
      - run: python3 -m conformance.network_audit fixtures/gtk/mirror-golden/observer.trace.jsonl --replay target/debug/examples/replay --expected fixtures/gtk/mirror-observer.audit.json
      - run: python3 -m conformance.indexed_network_audit fixtures/gtk/composition-golden/commit/protocol-final/index.json --replay target/debug/examples/replay --expected fixtures/gtk/composition-commit.audit.json
      - run: python3 -m unittest fixtures.gtk.test_composition_trace
      - run: python3 -m conformance.network_audit fixtures/gtk/desktop-composition-golden/controller.trace.jsonl --replay target/debug/examples/replay --expected fixtures/gtk/desktop-composition-controller.audit.json
      - run: python3 -m conformance.network_audit fixtures/gtk/desktop-composition-golden/observer.trace.jsonl --replay target/debug/examples/replay --expected fixtures/gtk/desktop-composition-observer.audit.json
